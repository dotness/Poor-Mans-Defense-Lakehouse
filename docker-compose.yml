services:
  traefik:
    image: traefik:v3.0
    container_name: artemis-traefik
    restart: unless-stopped
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./src/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./src/config/auth.yml:/etc/traefik/dynamic/auth.yml:ro
    networks:
      - artemis-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: artemis-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
    volumes:
      - ./src/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - artemis-net

  minio:
    image: minio/minio:latest
    container_name: artemis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - artemis-net

  postgres:
    image: postgres:16-alpine
    container_name: artemis-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artemis}
      POSTGRES_USER: ${POSTGRES_USER:-artemis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artemis_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/config/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - artemis-net

  redis:
    image: redis:7-alpine
    container_name: artemis-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - artemis-net

  memgraph:
    image: memgraph/memgraph:latest
    container_name: artemis-memgraph
    restart: unless-stopped
    ports:
      - "${MEMGRAPH_PORT:-7687}:7687"
    volumes:
      - memgraph_data:/var/lib/memgraph
    networks:
      - artemis-net

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: artemis-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-artemis}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-artemis_secure_password}
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DATABASE=temporal
      - POSTGRES_VISIBILITY_DATABASE=temporal_visibility
    depends_on:
      - postgres
    networks:
      - artemis-net

  temporal-ui:
    image: temporalio/ui:latest
    container_name: artemis-temporal-ui
    restart: unless-stopped
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - artemis-net

volumes:
  mosquitto_data:
  mosquitto_log:
  minio_data:
  postgres_data:
  redis_data:
  memgraph_data:

networks:
  artemis-net:
    driver: bridge
