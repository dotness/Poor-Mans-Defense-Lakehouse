[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis-platform"
version = "0.1.0"
description = "Poor Man's Defense Lakehouse: Sovereign Big Data Lakehouse and AI infostructure on a single VM"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Artemis Team" }
]
dependencies = [
    "duckdb>=1.1.0",
    "paho-mqtt>=2.0.0",
    "pydantic>=2.5.0",
    "google-genai>=0.1.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "neo4j>=5.15.0",
    "minio>=7.2.0",
    "pyarrow>=14.0.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "temporalio>=1.0.0",
    "pyjwt>=2.6.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "numpy>=1.26.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.2.0",
    "httpx>=0.25.0",
    "testcontainers>=3.7.0",
]

[project.scripts]
artemis = "src.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
